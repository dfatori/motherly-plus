<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".dashboard-updated-at").forEach((element) => {
    const modifiedAt = new Date(document.lastModified);
    element.textContent = new Intl.DateTimeFormat("pt-BR", {
      dateStyle: "short",
      timeStyle: "short",
      hour12: false
    }).format(modifiedAt);
  });
});
</script>
